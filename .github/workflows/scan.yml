name: Daily Stock Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 1-5'  # 7:00 AM IST, weekdays only
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "bot@stockpulse.local"
          git add docs/data/results.json docs/data/history.json
          git diff --staged --quiet || git commit -m "📊 Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
